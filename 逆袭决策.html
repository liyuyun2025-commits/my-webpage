<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如果我是梨云 - 逆袭模拟器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #FFF0F3 0%, #FFE4E8 50%, #FFF5F7 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .xiaohongshu-red {
            color: #FF2442;
        }
        
        .xiaohongshu-bg {
            background-color: #FF2442;
        }
        
        .xiaohongshu-border {
            border-color: #FF2442;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 36, 66, 0.1);
            box-shadow: 0 8px 32px rgba(255, 36, 66, 0.08);
        }
        
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        .float {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .pulse-red {
            animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
        
        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .money-fly {
            position: fixed;
            pointer-events: none;
            animation: flyUp 1.5s ease-out forwards;
            font-weight: bold;
            z-index: 100;
        }
        
        @keyframes flyUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        
        .warning-pulse {
            animation: warning-pulse 1s ease-in-out infinite;
        }
        
        @keyframes warning-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 36, 66, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(255, 36, 66, 0); }
        }
        
        .choice-btn {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 36, 66, 0.15);
        }
        
        .choice-btn:active {
            transform: translateY(0);
        }
        
        .trap-choice {
            border: 2px solid #FFB6C1;
            background: linear-gradient(135deg, #FFF0F3 0%, #FFFFFF 100%);
        }
        
        .trap-choice:hover {
            border-color: #FF2442;
            background: linear-gradient(135deg, #FFE4E8 0%, #FFF0F3 100%);
        }
        
        .progress-bar {
            transition: width 0.5s ease;
        }
        
        .modal-enter {
            animation: modalEnter 0.3s ease-out;
        }
        
        @keyframes modalEnter {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .stat-number {
            font-variant-numeric: tabular-nums;
        }
        
        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="text-gray-800 relative">
    <div class="grain"></div>
    
    <!-- 顶部状态栏 -->
    <div class="fixed top-0 left-0 right-0 z-40 glass-card border-b border-pink-200 px-4 py-3">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-400 to-red-400 flex items-center justify-center text-white font-bold text-sm">
                    梨云
                </div>
                <div class="text-xs">
                    <div class="font-bold text-gray-800">第 <span id="day-display" class="xiaohongshu-red text-lg stat-number">1</span> 天</div>
                    <div class="text-gray-500">距离上班还有 <span id="countdown" class="font-bold xiaohongshu-red">90</span> 天</div>
                </div>
            </div>
            
            <div class="flex gap-4 text-xs">
                <div class="text-center">
                    <div class="text-gray-500">粉丝</div>
                    <div id="fans-display" class="font-bold text-lg stat-number">0</div>
                </div>
                <div class="text-center">
                    <div class="text-gray-500">余额</div>
                    <div class="font-bold text-lg stat-number xiaohongshu-red">¥<span id="money-display">3000</span></div>
                </div>
                <div class="text-center">
                    <div class="text-gray-500">精力</div>
                    <div class="w-16 h-2 bg-gray-200 rounded-full mt-1 overflow-hidden">
                        <div id="energy-bar" class="h-full bg-gradient-to-r from-pink-400 to-red-400 progress-bar" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主游戏区 -->
    <div class="pt-24 pb-8 px-4 max-w-2xl mx-auto">
        
        <!-- 场景卡片 -->
        <div id="scene-card" class="glass-card rounded-2xl p-6 mb-6 min-h-[300px] relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-pink-200 to-red-200 rounded-full blur-3xl opacity-50 -mr-16 -mt-16"></div>
            
            <div id="scene-content" class="relative z-10">
                <div class="flex items-center gap-2 mb-4">
                    <span id="scene-tag" class="px-3 py-1 bg-red-50 text-red-500 rounded-full text-xs font-medium border border-red-100">新手期</span>
                    <span class="text-xs text-gray-400">生存挑战</span>
                </div>
                
                <h2 id="scene-title" class="text-xl font-bold mb-3 text-gray-800 leading-relaxed">
                    你决定开始做小红书，但手头只有3000元积蓄。房租即将到期，你会...
                </h2>
                
                <div id="scene-desc" class="text-gray-600 text-sm leading-relaxed mb-6 typing-cursor">
                    看着银行卡余额，你感到一阵焦虑。之前三次失败的经历在脑海中闪过，但这一次，你决定认真做。时间紧迫，必须尽快做出选择...
                </div>
                
                <!-- 插图区域 -->
                <div id="scene-image" class="w-full h-32 bg-gradient-to-r from-pink-100 to-red-50 rounded-xl mb-6 flex items-center justify-center text-4xl float">
                    💭
                </div>
            </div>
        </div>

        <!-- 选择区域 -->
        <div id="choices-container" class="space-y-3">
            <!-- 动态生成选项 -->
        </div>

        <!-- 事件日志 -->
        <div class="mt-8 glass-card rounded-xl p-4">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">决策记录</h3>
            <div id="event-log" class="space-y-2 text-sm max-h-40 overflow-y-auto">
                <div class="text-gray-400 text-xs">游戏开始... 你站在命运的十字路口</div>
            </div>
        </div>
    </div>

    <!-- 弹窗系统 -->
    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div id="modal-content" class="glass-card rounded-2xl p-6 max-w-sm w-full modal-enter border-2 border-red-100">
            <div class="text-center">
                <div id="modal-icon" class="text-5xl mb-4">⚠️</div>
                <h3 id="modal-title" class="text-xl font-bold mb-2 text-gray-800">警告</h3>
                <p id="modal-message" class="text-gray-600 text-sm mb-6">你确定要这样做吗？</p>
                <div class="flex gap-3">
                    <button onclick="closeModal()" class="flex-1 py-2 px-4 rounded-xl border border-gray-300 text-gray-600 text-sm hover:bg-gray-50 transition">
                        再想想
                    </button>
                    <button id="modal-confirm" class="flex-1 py-2 px-4 rounded-xl xiaohongshu-bg text-white text-sm hover:bg-red-600 transition">
                        确定
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏结束画面 -->
    <div id="game-over" class="fixed inset-0 bg-gradient-to-br from-pink-100 to-red-50 z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-8 max-w-md w-full text-center border-2 border-red-200">
            <div id="end-icon" class="text-6xl mb-4 float">🏆</div>
            <h2 id="end-title" class="text-2xl font-bold mb-2 text-gray-800">逆袭成功！</h2>
            <p id="end-desc" class="text-gray-600 mb-6">你成功避免了梨云早期的所有陷阱，成为了真正的博主。</p>
            
            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-xl p-3 shadow-sm">
                    <div class="text-xs text-gray-400">最终粉丝</div>
                    <div id="end-fans" class="font-bold text-lg xiaohongshu-red">17W</div>
                </div>
                <div class="bg-white rounded-xl p-3 shadow-sm">
                    <div class="text-xs text-gray-400">变现金额</div>
                    <div id="end-money" class="font-bold text-lg xiaohongshu-red">10W+</div>
                </div>
                <div class="bg-white rounded-xl p-3 shadow-sm">
                    <div class="text-xs text-gray-400">剩余天数</div>
                    <div id="end-days" class="font-bold text-lg">0</div>
                </div>
            </div>
            
            <button onclick="location.reload()" class="w-full py-3 rounded-xl xiaohongshu-bg text-white font-medium hover:bg-red-600 transition transform hover:scale-105">
                再玩一次
            </button>
        </div>
    </div>

    <script>
        // 游戏状态
        const state = {
            day: 1,
            maxDays: 90,
            fans: 0,
            money: 3000,
            energy: 100,
            reputation: 50,
            contentQuality: 0,
            trapCount: 0,
            history: [],
            currentScene: 'start'
        };

        // 场景数据
        const scenes = {
            start: {
                title: "第1天：命运的起点",
                desc: "你决定开始做小红书，但手头只有3000元积蓄。房租即将到期（月租1500），你会...",
                tag: "新手期",
                icon: "💭",
                choices: [
                    {
                        text: "先交房租，剩下的钱买设备（相机+灯光）",
                        trap: true,
                        effect: () => {
                            state.money -= 2800;
                            state.energy -= 20;
                            return "你花光了几乎所有积蓄买设备，但发现自己根本不会用。剩下的200元撑不过一个月...";
                        },
                        next: 'equipment_trap'
                    },
                    {
                        text: "先不交房租，拿钱报自媒体课程学习",
                        trap: true,
                        effect: () => {
                            state.money -= 2000;
                            state.energy -= 10;
                            return "课程全是理论，实操时发现被割韭菜了。房东开始催租，你陷入两难...";
                        },
                        next: 'course_trap'
                    },
                    {
                        text: "用现有手机开始，先不交房租，专注研究平台",
                        trap: false,
                        effect: () => {
                            state.money -= 0;
                            state.contentQuality += 10;
                            return "明智的选择！你花时间研究小红书算法，发现女性用户更喜欢情绪化的内容...";
                        },
                        next: 'research_phase'
                    }
                ]
            },
            
            equipment_trap: {
                title: "设备陷阱",
                desc: "你拥有了昂贵的设备，但第一篇笔记的小眼睛只有50。看着空荡荡的数据，你...",
                tag: "危机",
                icon: "📉",
                choices: [
                    {
                        text: "肯定是设备不够好，借钱买更专业的麦克风",
                        trap: true,
                        effect: () => {
                            state.money -= 1500;
                            state.energy -= 30;
                            return "负债累累！设备再好内容不行也是徒劳。粉丝数：0，焦虑值：100%";
                        },
                        next: 'debt_crisis'
                    },
                    {
                        text: "冷静下来，先研究为什么没人看",
                        trap: false,
                        effect: () => {
                            state.contentQuality += 15;
                            return "你发现封面和标题才是点击率的关键，设备并不重要...";
                        },
                        next: 'research_phase'
                    }
                ]
            },
            
            course_trap: {
                title: "知识付费陷阱",
                desc: "课程告诉你'内容为王'，但你发了10篇原创诗歌，每篇耗时2小时，小眼睛不过百。你...",
                tag: "迷茫期",
                icon: "😰",
                choices: [
                    {
                        text: "坚持原创，相信是金子总会发光，继续写诗",
                        trap: true,
                        effect: () => {
                            state.energy -= 40;
                            state.day += 10;
                            return "10天过去了，你感动了你自己，但粉丝依然为0。房租到期，你被迫去打工了...";
                        },
                        next: 'game_over_fail'
                    },
                    {
                        text: "意识到在自嗨，开始研究爆款逻辑",
                        trap: false,
                        effect: () => {
                            state.contentQuality += 20;
                            return "你醒悟了！小红书不是朋友圈，需要为用户提供价值...";
                        },
                        next: 'research_phase'
                    }
                ]
            },
            
            research_phase: {
                title: "第15天：发现秘密",
                desc: "你研究了20个对标账号，发现学习赛道多是男性创作者，内容偏理性。而小红书80%是女性用户！你决定...",
                tag: "洞察期",
                icon: "💡",
                choices: [
                    {
                        text: "搬运那个爆款'上瘾学习法'，改个封面就行",
                        trap: true,
                        effect: () => {
                            state.reputation -= 30;
                            state.fans += 100;
                            return "短期涨粉100，但被原作者粉丝举报攻击。账号限流，信誉受损...";
                        },
                        next: 'plagiarism_crisis'
                    },
                    {
                        text: "差异化竞争：用女性思维做学习内容，加入情绪价值",
                        trap: false,
                        effect: () => {
                            state.contentQuality += 25;
                            state.fans += 50;
                            return "你创造了'梨云绿'配色和温柔的学习方法，第一批粉丝开始关注！";
                        },
                        next: 'content_creation'
                    },
                    {
                        text: "选择心理学赛道，因为看起来火爆",
                        trap: true,
                        effect: () => {
                            state.energy -= 30;
                            state.day += 20;
                            return "你不懂心理学，日更100篇死磕到1万粉，但无法变现，最终断更...";
                        },
                        next: 'burnout_crisis'
                    }
                ]
            },
            
            plagiarism_crisis: {
                title: "抄袭危机",
                desc: "评论区被攻陷：'抄袭狗！' '举报了！' 你的账号被限流。此时...",
                tag: "信誉危机",
                icon: "⚠️",
                choices: [
                    {
                        text: "注销账号，重新注册，从头再来",
                        trap: true,
                        effect: () => {
                            state.fans = 0;
                            state.reputation = 20;
                            state.day += 30;
                            return "浪费了30天黄金期！新账号依然没方向，时间所剩无几...";
                        },
                        next: 'time_pressure'
                    },
                    {
                        text: "公开道歉，转型做原创'公主学习法'",
                        trap: false,
                        effect: () => {
                            state.reputation += 20;
                            state.fans += 200;
                            return "真诚的道歉挽回了部分声誉，原创内容开始获得认可！";
                        },
                        next: 'viral_moment'
                    }
                ]
            },
            
            content_creation: {
                title: "第30天：内容困境",
                desc: "你有了500粉丝，但每天花4小时做一篇笔记，增长缓慢。MCN机构找你签约，承诺保底收入，但要你日更3篇...",
                tag: "抉择点",
                icon: "📝",
                choices: [
                    {
                        text: "签约！有钱拿还能快速成长",
                        trap: true,
                        effect: () => {
                            state.money += 5000;
                            state.energy -= 50;
                            state.contentQuality -= 20;
                            return "MCN压榨你的劳动力，日更3篇导致质量下降，粉丝开始流失...";
                        },
                        next: 'mcn_trap'
                    },
                    {
                        text: "拒绝，保持质量，一周3更精品",
                        trap: false,
                        effect: () => {
                            state.contentQuality += 30;
                            state.fans += 1000;
                            return "质量为王！你的'卷王计划表'突然爆了，粉丝破千！";
                        },
                        next: 'viral_moment'
                    },
                    {
                        text: "借钱投DOU+，快速涨粉",
                        trap: true,
                        effect: () => {
                            state.money -= 2000;
                            state.fans += 500;
                            return "买来的粉丝不精准，互动率极低，算法不再推荐...";
                        },
                        next: 'algorithm_trap'
                    }
                ]
            },
            
            viral_moment: {
                title: "第45天：爆款诞生",
                desc: "你的'公主学习法'笔记爆了！10万点赞，粉丝暴涨。但评论区有人骂'太幼稚'、'没用'。你...",
                tag: "爆发期",
                icon: "🔥",
                choices: [
                    {
                        text: "怼回去：'不爱看就滚'",
                        trap: true,
                        effect: () => {
                            state.reputation -= 40;
                            return "舆论反噬！黑粉组织举报，账号被暂时封禁，错失流量高峰...";
                        },
                        next: 'ban_crisis'
                    },
                    {
                        text: "无视恶评，但也不再回复任何评论",
                        trap: true,
                        effect: () => {
                            state.fans -= 500;
                            return "粉丝觉得高冷，粘性下降。搬运工开始抄袭你，你毫无办法...";
                        },
                        next: 'copycat_crisis'
                    },
                    {
                        text: "每条都回复，提供情绪价值，建立人设",
                        trap: false,
                        effect: () => {
                            state.reputation += 30;
                            state.fans += 5000;
                            return "粉丝粘度极高！主页转粉率达到30%，你成为了'云云'，而不只是营销号！";
                        },
                        next: 'monetization'
                    }
                ]
            },
            
            monetization: {
                title: "第60天：变现抉择",
                desc: "粉丝破5万！两个选择：1. 引流卖99元写作课（辛苦但长远）2. 接广告（轻松但可能伤粉）。你...",
                tag: "变现期",
                icon: "💰",
                choices: [
                    {
                        text: "全力做课程，拒绝所有广告",
                        trap: true,
                        effect: () => {
                            state.money += 2000;
                            state.energy -= 60;
                            return "课程交付太重，你累病了，无法持续更新，粉丝流失...";
                        },
                        next: 'health_crisis'
                    },
                    {
                        text: "什么都接，有钱就赚",
                        trap: true,
                        effect: () => {
                            state.money += 8000;
                            state.reputation -= 50;
                            return "粉丝反感广告太多，取关严重。品牌方也觉得你掉价，不再合作...";
                        },
                        next: 'reputation_crash'
                    },
                    {
                        text: "精选品牌广告，同时打磨高价课程",
                        trap: false,
                        effect: () => {
                            state.money += 15000;
                            state.fans += 5000;
                            return "广告收入稳定，粉丝信任度高。你接到了第一个5000元商单！";
                        },
                        next: 'final_push'
                    }
                ]
            },
            
            final_push: {
                title: "第75天：最后冲刺",
                desc: "距离'必须去上班'的deadline还有15天。你现在有10万粉丝，月入3万。但身体透支，你...",
                tag: "终局",
                icon: "🏃‍♀️",
                choices: [
                    {
                        text: "拼命日更，趁红利期多赚钱",
                        trap: true,
                        effect: () => {
                            state.energy = 0;
                            return "过劳住院！账号停更，粉丝被竞争对手吸走，一切归零...";
                        },
                        next: 'game_over_fail'
                    },
                    {
                        text: "保持节奏，组建小团队分担",
                        trap: false,
                        effect: () => {
                            state.money += 20000;
                            state.fans += 70000;
                            return "你成功逆袭！3个月粉丝17万，变现10万+，成立了个人工作室！";
                        },
                        next: 'game_over_success'
                    },
                    {
                        text: "见好就收，去找份安稳工作",
                        trap: true,
                        effect: () => {
                            return "你放弃了自媒体，回去打工。虽然稳定，但错过了时代红利...";
                        },
                        next: 'game_over_normal'
                    }
                ]
            },
            
            // 失败结局
            debt_crisis: {
                title: "债务危机",
                desc: "你负债累累，设备被二手卖掉还债。不得不去打工还钱。",
                tag: "失败",
                icon: "💸",
                choices: [],
                end: 'fail'
            },
            
            burnout_crisis: {
                title: " burnout",
                desc: "没有变现的日更让你精疲力竭，你删除了所有内容。",
                tag: "失败",
                icon: "😔",
                choices: [],
                end: 'fail'
            },
            
            time_pressure: {
                title: "时间耗尽",
                desc: "反复试错耗尽了时间，你必须去找工作了。",
                tag: "失败",
                icon: "⏰",
                choices: [],
                end: 'fail'
            },
            
            mcn_trap: {
                title: "MCN陷阱",
                desc: "合同陷阱让你无法解约，成为了廉价劳动力。",
                tag: "失败",
                icon: "⛓️",
                choices: [],
                end: 'fail'
            },
            
            algorithm_trap: {
                title: "算法惩罚",
                desc: "低质量流量让账号权重降低，再也无法起量。",
                tag: "失败",
                icon: "🤖",
                choices: [],
                end: 'fail'
            },
            
            ban_crisis: {
                title: "账号封禁",
                desc: "激烈言辞导致永久封禁，IP彻底毁掉。",
                tag: "失败",
                icon: "🚫",
                choices: [],
                end: 'fail'
            },
            
            copycat_crisis: {
                title: "被抄袭淹没",
                desc: "没有建立人设，粉丝认内容不认人，被搬运工超越。",
                tag: "失败",
                icon: "👥",
                choices: [],
                end: 'fail'
            },
            
            health_crisis: {
                title: "健康崩溃",
                desc: "过度劳累导致住院，错失最佳发展期。",
                tag: "失败",
                icon: "🏥",
                choices: [],
                end: 'fail'
            },
            
            reputation_crash: {
                title: "信誉崩塌",
                desc: "粉丝取关，品牌拉黑，账号废了。",
                tag: "失败",
                icon: "📉",
                choices: [],
                end: 'fail'
            },
            
            // 成功结局
            game_over_success: {
                title: "逆袭成功！",
                desc: "你成为了小红书教育榜第2名，收到了MCN机构邀请，但这一次，是你选择他们。",
                tag: "完美结局",
                icon: "👑",
                choices: [],
                end: 'success'
            },
            
            game_over_normal: {
                title: "平凡结局",
                desc: "你选择了安稳，虽然没有大富大贵，但也避免了风险。",
                tag: "普通结局",
                icon: "😐",
                choices: [],
                end: 'normal'
            },
            
            game_over_fail: {
                title: "逆袭失败",
                desc: "你成为了梨云'三战三败'故事中的其中一次失败。",
                tag: "失败",
                icon: "💔",
                choices: [],
                end: 'fail'
            }
        };

        // 初始化游戏
        function initGame() {
            updateUI();
            loadScene('start');
        }

        // 更新UI
        function updateUI() {
            document.getElementById('day-display').textContent = state.day;
            document.getElementById('countdown').textContent = Math.max(0, state.maxDays - state.day);
            document.getElementById('fans-display').textContent = formatNumber(state.fans);
            document.getElementById('money-display').textContent = state.money;
            document.getElementById('energy-bar').style.width = state.energy + '%';
            
            // 倒计时警告
            if (state.maxDays - state.day <= 15) {
                document.getElementById('countdown').classList.add('warning-pulse');
            }
            
            // 金钱警告
            if (state.money < 500) {
                document.getElementById('money-display').parentElement.classList.add('warning-pulse');
            }
        }

        // 格式化数字
        function formatNumber(num) {
            if (num >= 10000) return (num / 10000).toFixed(1) + 'W';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        // 加载场景
        function loadScene(sceneId) {
            const scene = scenes[sceneId];
            state.currentScene = sceneId;
            
            // 检查是否是结局
            if (scene.end) {
                showEnding(scene.end);
                return;
            }
            
            // 更新场景内容
            document.getElementById('scene-title').textContent = scene.title;
            document.getElementById('scene-desc').textContent = scene.desc;
            document.getElementById('scene-tag').textContent = scene.tag;
            document.getElementById('scene-image').textContent = scene.icon;
            
            // 生成选项
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            scene.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = `choice-btn w-full text-left p-4 rounded-xl border-2 ${choice.trap ? 'trap-choice' : 'border-white bg-white hover:border-red-200'} relative group`;
                
                const trapIcon = choice.trap ? '<span class="absolute right-4 top-4 text-red-300 opacity-0 group-hover:opacity-100 transition">💀</span>' : '';
                
                btn.innerHTML = `
                    <div class="font-medium text-gray-800 mb-1">${choice.text}</div>
                    <div class="text-xs text-gray-400">${choice.trap ? '看起来诱人...' : '需要深思熟虑'}</div>
                    ${trapIcon}
                `;
                
                btn.onclick = () => makeChoice(choice, index);
                choicesContainer.appendChild(btn);
            });
            
            // 添加紧迫感提示
            if (state.maxDays - state.day <= 20 && !scene.choices[0]?.next?.includes('game_over')) {
                showUrgentNotice();
            }
        }

        // 做出选择
        function makeChoice(choice, index) {
            // 消耗精力
            state.energy -= 10;
            if (state.energy <= 0) {
                showEnding('fail');
                return;
            }
            
            // 执行效果
            const result = choice.effect();
            state.day += Math.floor(Math.random() * 5) + 3; // 随机推进3-7天
            
            // 记录日志
            addLog(choice.text, result, choice.trap);
            
            // 显示效果动画
            if (choice.trap) {
                document.getElementById('scene-card').classList.add('shake');
                setTimeout(() => document.getElementById('scene-card').classList.remove('shake'), 500);
                state.trapCount++;
            }
            
            // 金钱动画
            if (state.money < 3000) {
                showMoneyAnimation('-¥' + (3000 - state.money));
            }
            
            updateUI();
            
            // 延迟进入下一场景
            setTimeout(() => {
                if (choice.next) {
                    loadScene(choice.next);
                }
            }, 1000);
        }

        // 添加日志
        function addLog(choice, result, isTrap) {
            const log = document.getElementById('event-log');
            const entry = document.createElement('div');
            entry.className = `p-2 rounded-lg text-xs ${isTrap ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-600 border border-green-100'}`;
            entry.innerHTML = `
                <div class="font-bold mb-1">第${state.day}天：${isTrap ? '⚠️ 踩坑了！' : '✓ 明智选择'}</div>
                <div class="text-gray-600 mb-1">你选择了：${choice}</div>
                <div>${result}</div>
            `;
            log.insertBefore(entry, log.firstChild);
        }

        // 显示紧急通知
        function showUrgentNotice() {
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            document.getElementById('modal-icon').textContent = '⏰';
            document.getElementById('modal-title').textContent = '时间紧迫！';
            document.getElementById('modal-title').className = 'text-xl font-bold mb-2 text-red-600';
            document.getElementById('modal-message').textContent = `距离必须去上班只剩 ${state.maxDays - state.day} 天了！你的积蓄还剩 ¥${state.money}。每一个选择都至关重要！`;
            document.getElementById('modal-confirm').textContent = '我知道';
            document.getElementById('modal-confirm').onclick = closeModal;
            
            modal.classList.remove('hidden');
        }

        // 显示结局
        function showEnding(type) {
            const overlay = document.getElementById('game-over');
            const title = document.getElementById('end-title');
            const desc = document.getElementById('end-desc');
            const icon = document.getElementById('end-icon');
            
            overlay.classList.remove('hidden');
            
            if (type === 'success') {
                title.textContent = '逆袭成功！';
                title.className = 'text-2xl font-bold mb-2 text-red-600';
                desc.textContent = '你成功复制了梨云的路径，甚至做得更好！3个月粉丝17万，变现10万+，你证明了普通人也能逆袭。';
                icon.textContent = '👑';
                document.getElementById('end-fans').textContent = '17W';
                document.getElementById('end-money').textContent = '10W+';
            } else if (type === 'normal') {
                title.textContent = '平凡结局';
                title.className = 'text-2xl font-bold mb-2 text-gray-600';
                desc.textContent = '你选择了安稳，回去上班了。虽然没有大富大贵，但也避免了更大的风险。';
                icon.textContent = '😐';
                document.getElementById('end-fans').textContent = formatNumber(state.fans);
                document.getElementById('end-money').textContent = '0';
            } else {
                title.textContent = '逆袭失败';
                title.className = 'text-2xl font-bold mb-2 text-gray-500';
                desc.textContent = `你踩了${state.trapCount}个坑，最终没能坚持下去。正如梨云的前三次失败，创业九死一生。`;
                icon.textContent = '💔';
                document.getElementById('end-fans').textContent = formatNumber(state.fans);
                document.getElementById('end-money').textContent = '负债';
            }
            
            document.getElementById('end-days').textContent = state.maxDays - state.day;
        }

        // 金钱飞行动画
        function showMoneyAnimation(text) {
            const el = document.createElement('div');
            el.className = 'money-fly xiaohongshu-red text-2xl';
            el.textContent = text;
            el.style.left = Math.random() * window.innerWidth + 'px';
            el.style.top = window.innerHeight / 2 + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        // 启动游戏
        window.onload = initGame;
    </script>
</body>
</html>
